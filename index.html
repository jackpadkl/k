<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ТВОЙ ПОКЕР. ВСЕГДА С ТОБОЙ.</title>
<style>
:root{color-scheme:dark;--bg:#08110f;--text:#f4f3ed;--muted:#c2cbc5;--green:#087d63;--line:#ffffff20}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100svh;background:radial-gradient(ellipse at 78% 50%,#123c302e 0,transparent 48%),var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
.page{min-height:100vh;min-height:100svh;display:flex;align-items:center;overflow:hidden}
main{width:100%;max-width:1200px;margin:0 auto;padding:clamp(28px,7vw,88px);display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,.55fr);align-items:center;gap:clamp(28px,6vw,80px)}
.copy{max-width:650px}
h1{margin:0 0 24px;font-size:clamp(42px,6.2vw,76px);line-height:.99;letter-spacing:-.055em;font-weight:750}
h1 span{display:block}
.subtitle{margin:0 0 30px;color:var(--muted);font-size:clamp(17px,1.8vw,21px);line-height:1.5}
.benefits{list-style:none;padding:0;margin:0 0 36px;display:grid;gap:15px}
.benefits li{display:flex;align-items:flex-start;gap:12px;font-size:16px;line-height:1.45}
.check{flex:0 0 17px;width:17px;height:17px;margin-top:2px;border:1px solid #30b995;border-radius:50%;position:relative}
.check:after{content:"";position:absolute;width:6px;height:3px;left:4px;top:5px;border-left:1.5px solid #65e0bd;border-bottom:1.5px solid #65e0bd;transform:rotate(-45deg)}
.cta{display:flex;align-items:center;justify-content:space-between;gap:24px;width:min(100%,360px);min-height:58px;padding:0 22px;background:var(--green);border:1px solid #31b795;border-radius:4px;color:#fff;text-decoration:none;font-size:14px;font-weight:700;letter-spacing:.035em;transition:background-color .15s ease}
.cta:hover,.cta:focus-visible{background:#099574}
.arrow{font-size:22px;line-height:1}
.ambient{height:min(42vw,390px);min-height:220px;position:relative;display:grid;place-items:center;pointer-events:none}
.ambient:before{content:"";width:100%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at center,#164e3d 0,#103529 28%,#0b201a 53%,transparent 72%);opacity:.8}
.ambient:after{content:"";position:absolute;width:74%;height:1px;background:linear-gradient(90deg,transparent,#4a9c80a0,transparent);transform:rotate(-34deg)}
@media(max-width:700px){
 .page{align-items:flex-start}
 main{grid-template-columns:minmax(0,1fr);gap:0;padding:clamp(28px,8vw,48px) 24px 30px}
 h1{font-size:clamp(39px,10.3vw,60px);line-height:1.01;margin-bottom:20px}
 .subtitle{font-size:17px;margin-bottom:25px}
 .benefits{gap:13px;margin-bottom:28px}
 .benefits li{font-size:15px}
 .cta{width:100%;min-height:56px}
 .ambient{height:clamp(110px,32vw,190px);min-height:110px;margin-top:14px}
 .ambient:before{width:min(55vw,190px)}
}
@media(max-width:360px){
 main{padding-left:19px;padding-right:19px}
 h1{font-size:37px}
}
@media(prefers-reduced-motion:reduce){.cta{transition:none}}
</style>
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
fbq('init','1399310622039113');fbq('track','PageView');
</script>
</head>
<body>
<div class="page">
<main>
<section class="copy">
<h1><span>ТВОЙ ПОКЕР.</span><span>ВСЕГДА С ТОБОЙ.</span></h1>
<p class="subtitle">Игра в удобном для тебя ритме.</p>
<ul class="benefits">
<li><span class="check" aria-hidden="true"></span><span>Удобный мобильный интерфейс</span></li>
<li><span class="check" aria-hidden="true"></span><span>Игра на разных устройствах</span></li>
<li><span class="check" aria-hidden="true"></span><span>Разнообразие покерных форматов</span></li>
</ul>

</section>
<div class="ambient" aria-hidden="true"></div>
</main>
</div>

</html>
